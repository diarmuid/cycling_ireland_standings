$SERVER["socket"] == ":443" {
    ssl.engine = "enable"

    # Default cert (used as fallback before SNI resolves)
    ssl.pemfile = "/etc/letsencrypt/live/icl.clubleague.org/combined.pem"
    ssl.ca-file = "/etc/letsencrypt/live/icl.clubleague.org/fullchain.pem"

    ssl.use-sslv2 = "disable"
    ssl.use-sslv3 = "disable"
    ssl.cipher-list = "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"
    ssl.honor-cipher-order = "enable"

    # --- icl.clubleague.org ---
    $HTTP["host"] =~ "icl.clubleague.org" {
        proxy.server = ( "" =>
            (( "host" => "127.0.0.1", "port" => 8000 ))
        )
    }

    # --- rankings.undo.it ---
    $HTTP["host"] == "rankings.undo.it" {
        ssl.pemfile = "/etc/lighttpd/rankings.undo.it.pem"

        server.document-root = "/home/diarmuid/cycling_ireland_standings/"
        server.errorlog      = "/var/log/lighttpd/rankings.com-error.log"
        accesslog.filename   = "/var/log/lighttpd/rankings.com-access.log"

        proxy.server = ( "" =>
            (( "host" => "127.0.0.1", "port" => 8090 ))
        )

        $HTTP["url"] =~ "^/static/" {
            proxy.server = ( )
        }

        $HTTP["url"] =~ "^/\.well-known/acme-challenge/" {
            proxy.server = ( )
        }
    }
}

# --- HTTP -> HTTPS redirects ---
$HTTP["scheme"] == "http" {
    $HTTP["host"] =~ "icl.clubleague.org" {
        url.redirect = (".*" => "https://icl.clubleague.org$0")
    }
    $HTTP["host"] == "rankings.undo.it" {
        url.redirect = (".*" => "https://rankings.undo.it$0")
    }
}